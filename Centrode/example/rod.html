<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미끄러지는 막대의 centrode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.42.0/dist/tabler-icons.min.css">
<style>
:root {
  color-scheme: light dark;
  --font-sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 0.5rem;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --border: hsl(0 0% 4% / 10%);
  --border-strong: hsl(0 0% 4% / 20%);
  --thumb: #ffffff;
  --track: rgba(0, 0, 0, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-1: #151515;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --border: hsl(0 0% 100% / 10%);
    --border-strong: hsl(0 0% 100% / 20%);
    --thumb: #1a1a19;
    --track: rgba(255, 255, 255, 0.1);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { padding: 16px; font-family: var(--font-sans); color: var(--text-primary); background: var(--surface-1); }
input, button, text { font-family: var(--font-sans); }
#vis-container { width: 100%; position: relative; }
#vis-container > svg { display: block; margin-inline: auto; max-width: 100%; height: auto; overflow: visible; }
.th { font-size: 14px; fill: var(--text-primary); font-weight: 500; }
.ts { font-size: 12px; fill: var(--text-secondary); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: var(--track); border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--thumb); border: 1px solid var(--border-strong); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--thumb); border: 1px solid var(--border-strong); cursor: pointer; }
button { font-size: 14px; background: transparent; color: var(--text-primary); border: 0.5px solid var(--border-strong); border-radius: var(--radius); cursor: pointer; transition: background 0.15s, transform 0.1s; }
button:hover { background: var(--border); }
button:active { transform: scale(0.98); }
</style>
</head>
<body>
<div id="vis-container"><h2 class="sr-only">벽과 바닥을 따라 미끄러지는 막대의 공간 centrode와 물체 centrode를 고정 좌표계와 막대 좌표계에서 나란히 보여 주는 애니메이션</h2>
<svg width="100%" viewBox="0 0 680 375" role="img">
<title>미끄러지는 막대의 두 centrode</title>
<desc>왼쪽은 고정 좌표계로, 반지름 L의 공간 centrode가 멈춰 있고 지름 L의 물체 centrode가 그 안을 구릅니다. 오른쪽은 막대 좌표계로, 물체 centrode가 멈춰 있고 공간 centrode가 그 둘레를 구릅니다.</desc>
<text class="th" x="165" y="18" text-anchor="middle">바닥에 서서 본 모습</text>
<text class="ts" x="165" y="36" text-anchor="middle">공간 centrode가 멈춰 있음</text>
<text class="th" x="515" y="18" text-anchor="middle">막대에 올라타서 본 모습</text>
<text class="ts" x="515" y="36" text-anchor="middle">물체 centrode가 멈춰 있음</text>
<line x1="345" y1="10" x2="345" y2="365" stroke="var(--border)" stroke-width="0.5"></line>
<line x1="110" y1="265" x2="325" y2="265" stroke="var(--text-secondary)" stroke-width="1.5"></line>
<line x1="110" y1="265" x2="110" y2="52" stroke="var(--text-secondary)" stroke-width="1.5"></line>
<text class="ts" x="96" y="282">O</text>
<g id="L"></g><g id="R"></g>
</svg>
<div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--text-secondary);margin:8px 0 14px">
<span><span style="display:inline-block;width:10px;height:10px;background:#D85A30;margin-right:6px"></span>공간 centrode</span>
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1D9E75;margin-right:6px"></span>물체 centrode</span>
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#BA7517;margin-right:6px"></span>순간중심 C</span>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
<button id="play" aria-label="일시정지" style="width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center"><i id="playIcon" class="ti ti-player-pause" aria-hidden="true"></i></button>
<label for="s" style="font-size:14px;color:var(--text-secondary)">진행</label>
<input type="range" id="s" min="0" max="70" step="0.1" value="0" style="flex:1">
<span id="ang" style="font-size:14px;font-weight:500;min-width:44px;text-align:right">80°</span>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 16px"><div style="font-size:13px;color:var(--text-secondary)">공간 centrode 위 이동 거리</div><div id="d1" style="font-size:22px;font-weight:500">0.00 L</div></div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 16px"><div style="font-size:13px;color:var(--text-secondary)">물체 centrode 위 이동 거리</div><div id="d2" style="font-size:22px;font-weight:500">0.00 L</div></div>
</div>
<script>
const SP='#D85A30',BD='#1D9E75',IC='#BA7517',T0=80,rad=d=>d*Math.PI/180;
const toL=(x,y)=>[110+190*x,265-190*y],toR=(x,y)=>[515+105*x,205-105*y];
const f=n=>n.toFixed(1);
function arc(to,cx,cy,r,a0,a1,color,w,dash){let d='';const n=64;for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,p=to(cx+r*Math.cos(a),cy+r*Math.sin(a));d+=(i?'L':'M')+f(p[0])+' '+f(p[1])}return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" ${dash?'stroke-dasharray="3 4" opacity="0.55"':''} stroke-linecap="round"/>`}
const sq=(p,c)=>`<rect x="${f(p[0]-3.5)}" y="${f(p[1]-3.5)}" width="7" height="7" fill="${c}"/>`;
const dot=(p,c,r=3.5)=>`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="${c}"/>`;
const ln=(a,b,c,w,x='')=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
const tx=(p,s,dx=0,dy=0)=>`<text class="th" x="${f(p[0]+dx)}" y="${f(p[1]+dy)}" text-anchor="middle" dominant-baseline="central">${s}</text>`;
const ar=(p,q,c)=>{const dx=q[0]-p[0],dy=q[1]-p[1],n=Math.hypot(dx,dy);if(n<4)return'';const ux=dx/n,uy=dy/n,hl=9,hc=Math.cos(.5),hs=Math.sin(.5);return ln(p,q,c,1.5)+ln(q,[q[0]-hl*(ux*hc-uy*hs),q[1]-hl*(uy*hc+ux*hs)],c,1.5)+ln(q,[q[0]-hl*(ux*hc+uy*hs),q[1]-hl*(uy*hc-ux*hs)],c,1.5)};
const ticks=[80,70,60,50,40,30,20,10].map(rad);
function draw(deg){
const t=rad(deg),t0=rad(T0),c=Math.cos(t),s=Math.sin(t),P='var(--text-primary)',Q='var(--text-secondary)';
const A=toL(0,s),B=toL(c,0),I=toL(c,s),mx=c/2,my=s/2;
let h=arc(toL,0,0,1,0,Math.PI/2,SP,1.5,true)+arc(toL,0,0,1,t0,t,SP,3.5);
h+=arc(toL,mx,my,.5,0,2*Math.PI,BD,1.5,true)+arc(toL,mx,my,.5,2*t0-t,t,BD,3.5);
ticks.forEach(k=>{h+=sq(toL(Math.cos(k),Math.sin(k)),SP);const a=2*k-t;h+=dot(toL(mx+.5*Math.cos(a),my+.5*Math.sin(a)),BD)});
h+=ln(A,I,Q,1,'stroke-dasharray="4 4"')+ln(B,I,Q,1,'stroke-dasharray="4 4"')+ln(A,B,P,4);
h+=ar(A,[A[0],A[1]+60*c],Q)+ar(B,[B[0]-60*s,B[1]],Q);
h+=dot(A,P,4.5)+dot(B,P,4.5)+dot(I,IC,6.5)+tx(A,'A',-16,0)+tx(B,'B',4,18)+tx(I,'C',14,-12);
document.getElementById('L').innerHTML=h;
const ox=.5*Math.cos(2*t+Math.PI),oy=.5*Math.sin(2*t+Math.PI),ix=.5*Math.cos(2*t),iy=.5*Math.sin(2*t);
let r=arc(toR,ox,oy,1,0,2*Math.PI,SP,1.5,true)+arc(toR,ox,oy,1,t0+t,2*t,SP,3.5);
r+=arc(toR,0,0,.5,0,2*Math.PI,BD,1.5,true)+arc(toR,0,0,.5,2*t0,2*t,BD,3.5);
ticks.forEach(k=>{const a=k+t;r+=sq(toR(ox+Math.cos(a),oy+Math.sin(a)),SP);r+=dot(toR(.5*Math.cos(2*k),.5*Math.sin(2*k)),BD)});
const a=toR(-.5,0),b=toR(.5,0),i=toR(ix,iy),o=toR(ox,oy);
r+=ln(a,b,P,4)+dot(a,P,4.5)+dot(b,P,4.5)+dot(o,Q,3.5)+dot(i,IC,6.5)+tx(a,'A',-2,17)+tx(b,'B',2,17)+tx(o,'O',12,12)+tx(i,'C',12*Math.cos(2*t)+Math.sign(Math.cos(2*t)||1)*3,-12*Math.sin(2*t)-3);
document.getElementById('R').innerHTML=r;
const len=(t0-t).toFixed(2)+' L';
document.getElementById('d1').textContent=len;document.getElementById('d2').textContent=len;
document.getElementById('ang').textContent=Math.round(deg)+'°';
}
const S=document.getElementById('s'),B=document.getElementById('play'),IC_=document.getElementById('playIcon');
let on=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0,hold=0;
function ui(){IC_.className='ti '+(on?'ti-player-pause':'ti-player-play');B.setAttribute('aria-label',on?'일시정지':'재생')}
function tick(n){const dt=Math.min(n-last,50);last=n;if(on){if(hold>0){hold-=dt;if(hold<=0)S.value=0}else{let v=+S.value+dt*.0085;if(v>=70){v=70;hold=1200}S.value=v}draw(T0-S.value)}requestAnimationFrame(tick)}
B.onclick=()=>{on=!on;hold=0;if(on&&+S.value>=70)S.value=0;ui()};
S.oninput=()=>{on=false;hold=0;ui();draw(T0-S.value)};
ui();draw(T0);requestAnimationFrame(t=>{last=t;tick(t)});
</script>
</div>
</body>
</html>
